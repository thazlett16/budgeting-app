[package]
name = "budgeting-app"
version = "0.1.0"
description = "Budget & Net Worth Tracker"
authors = ["Tim Hazlett"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "budgeting_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rust_xlsxwriter = "0.79"
genpdf = "0.2"
thiserror = "2"
jiff = { version = "0.2.35", features = ["serde"] }

[dev-dependencies]

# NOTE: versions above are unpinned majors, not validated against crates.io
# yet (no network access at scaffold time) — run `cargo update` and check
# each crate's current release before Phase 1 of the backend plan.

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
